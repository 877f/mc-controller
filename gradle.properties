# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.59

## Mod Properties
mod_id=mccontroler
mod_name=MC Controler
# LGPL-3.0 because this mod links against Baritone, which is LGPL-3.0-only.
mod_license=LGPL-3.0-only
mod_version=1.3
mod_group_id=com.mccontroler

## MC Controler
# Port the local control panel listens on.
webui_port=7654
